# Ford Ranger Raptor 2.0 4×4, 2026 — карточка для фида Auto.ru (раздел «Новые»).
# Схема и значения — docs/autoru-feed.md (официальная справка Авто.ру).
#
#   python -m scripts.build_from_card data/cards/ford-ranger-raptor-2026-autoru.yaml
#
# ⚠️ РАСШИВКА ПО ГОРОДАМ. На Авто.ру в фиде НЕТ поля «город объявления»:
# регион берётся из салона дилера в кабинете, а poi_id (адрес осмотра,
# отличный от салона) включается только через поддержку Авто.ру. Поэтому
# «одна машина = 129 объявлений по МО», как на Drom, здесь не делается.
# Легальный аналог — ОДНО объявление + delivery_info (до 10 городов).
# Секции fanout здесь нет намеренно.
#
# ⚠️ folder_id и body_type — строго из каталога Авто.ру. body_type «Пикап»
# из строгого списка. folder_id проверьте в каталоге модели (марка →
# модель → поколение): точное написание может отличаться. [Уточнить]

platform: autoru

offer:
  # ── Идентификация ────────────────────────────────────────────────
  mark_id: "Ford"                         # из каталога Авто.ру
  folder_id: "Ranger"                     # [Уточнить] модель+поколение по каталогу
  complectation_name: "Raptor"            # обязателен для «Новых», если есть в каталоге
  vin: "MPBAMFE60SX697372"                # 17 симв., латиница без I/O/Q
  year: "2026"

  # ── Двигатель пятью параметрами (без modification_id) ────────────
  # modification_id НЕ указываем — тогда двигатель задаётся так:
  engine_volume: "1996"                   # см³ (2.0 л битурбо дизель)
  engine_power: "210 л.с."
  engine_type: "Дизель"
  gearbox: "Автоматическая"
  drive: "Полный"

  # ── Кузов / внешний вид ──────────────────────────────────────────
  body_type: "Пикап"                      # строгий список
  doors_count: "4"                        # двойная кабина
  wheel: "левый"
  color: "Серый"                          # строгий список
  metallic: "да"

  # ── Статусы ──────────────────────────────────────────────────────
  availability: "На заказ"                # В наличии / На заказ / В пути
  custom: "Растаможен"
  owners_number: "Не было владельцев"     # значение только для «Новых»
  pts: "Оригинал"

  # ── Цена ─────────────────────────────────────────────────────────
  price: "8300000"                        # целое > 1500
  currency: "RUR"
  with_nds: "true"                        # цена с НДС

  # ── Опции (строго из справочника extras Авто.ру), через запятую ──
  extras: "Светодиодные фары, Противотуманные фары, Система управления дальним светом, Легкосплавные диски, Диски 17, Климат-контроль 2-зонный, Адаптивный круиз-контроль, Система выбора режима движения, Камера 360°, Парктроник задний, Парктроник передний, Система автоматической парковки, Проекционный дисплей, Электронная приборная панель, Запуск двигателя с кнопки, Система доступа без ключа, Беспроводная зарядка для смартфона, Розетка 12V, Розетка 220V, USB, Bluetooth, CarPlay, Android Auto, Кожа (Материал салона), Электрорегулировка передних сидений, Подогрев передних сидений, Подогрев задних сидений, Отделка кожей рулевого колеса, Антиблокировочная система (ABS), Система стабилизации (ESP), Система помощи при спуске, Система помощи при старте в гору (HSA), Система контроля слепых зон, Система предотвращения столкновения, Система распознавания дорожных знаков, Датчик давления в шинах, Подушка безопасности водителя, Подушка безопасности пассажира, Подушки безопасности боковые, Подушки безопасности оконные (шторки), Крепление детского кресла (задний ряд) ISOFIX, Фаркоп, Защита картера"

  # ── Доставка: до 10 городов МО (аналог «расшивки» для Авто.ру) ───
  delivery_info: "Московская область, Балашиха|Московская область, Химки|Московская область, Подольск|Московская область, Мытищи|Московская область, Королёв|Московская область, Люберцы|Московская область, Красногорск|Московская область, Одинцово|Московская область, Домодедово|Московская область, Электросталь"

  # ── Фото (JPG, 4:3, до 40 шт.) ───────────────────────────────────
  images: "https://i.ibb.co/hRd991F0/Frame-49.jpg|https://i.ibb.co/KpdHRmZ5/Frame-50.jpg|https://i.ibb.co/NgCK6t79/Frame-51.jpg|https://i.ibb.co/0Nyp8G2/Frame-52.jpg|https://i.ibb.co/LXV4zQf7/Frame-53.jpg|https://i.ibb.co/4R83F7K9/Frame-54.jpg|https://i.ibb.co/35db8XGt/Frame-55.jpg|https://i.ibb.co/d4D1FM0W/Frame-56.jpg|https://i.ibb.co/XrpQpK0c/Frame-57.jpg|https://i.ibb.co/bRNVk4g6/Frame-58.jpg|https://i.ibb.co/QFnzR9cW/Frame-59.jpg|https://i.ibb.co/0pJcBTQY/Frame-60.jpg|https://i.ibb.co/Mx2ncfnJ/Frame-61.jpg|https://i.ibb.co/jP2QVxdg/Frame-62.jpg|https://i.ibb.co/pBkz71c9/Frame-63.jpg|https://i.ibb.co/s9S6dHTx/Frame-64.jpg|https://i.ibb.co/BVwhb9f7/Frame-65.jpg|https://i.ibb.co/2YPRJ3G6/Frame-66.jpg|https://i.ibb.co/671PHzNG/Frame-67.jpg|https://i.ibb.co/zHS8Hzb7/Frame-68.jpg|https://i.ibb.co/hxG0ywfs/Frame-69.jpg|https://i.ibb.co/8gJqSg1s/Frame-70.jpg|https://i.ibb.co/JR1Bpy5z/Frame-71.jpg|https://i.ibb.co/HDxdJDBg/Frame-72.jpg|https://i.ibb.co/0VMbrGCr/Frame-73.jpg|https://i.ibb.co/60BpDDwT/Frame-74.jpg|https://i.ibb.co/fdt6w2qP/Frame-75.jpg|https://i.ibb.co/dw5rLM0S/Frame-76.jpg|https://i.ibb.co/wFsdZ8rZ/Frame-77.jpg|https://i.ibb.co/39ZwFBx0/Frame-78.jpg"

  # ── Описание (до 30 000 символов) ────────────────────────────────
  description: |
    Ford Ranger Raptor 2.0 4×4, 2026 — новый, под заказ.
    Доставка по всей России, в том числе по городам Московской области.

    Дизель 2.0 л битурбо, автомат 10 передач, полный привод 4×4.
    Terrain Management — 7 режимов движения. Шины 285/70 R17,
    легкосплавные диски. Пикап, двойная кабина: 4 двери, 5 мест,
    левый руль. Сборка Таиланд.

    В салоне: экран 12″, приборная панель 12,4″, SYNC 4A, беспроводные
    CarPlay и Android Auto, сиденья Raptor с электрорегулировкой,
    двухзонный климат, адаптивный круиз Stop & Go, беспроводная зарядка,
    розетки 12V и 230V, USB в двух рядах.

    Безопасность: 7 подушек, ISOFIX, автоторможение с распознаванием
    пешеходов, контроль слепых зон, камеры 360°, парктроники, автопилот
    парковки, ABS, ESP, HDC, TPMS.

    Снаружи: матричные LED-фары с адаптивным дальним, C-образные ходовые
    огни, противотуманки, арки Raptor, защита днища, bedliner с розетками,
    буксировочные крюки.

    Цвета под заказ: белый, синий, серый, оранжевый, чёрный.

    Продавец — SGM Auto Group. Гарантия 1 год. Цена 8 300 000 ₽ с НДС.
    Полный пакет документов для юрлиц. Позвоните — назовём свободные цвета
    и сроки поставки, рассчитаем доставку в ваш город.
