    Дизель 2.0 л, битурбо
    Автомат, 10 передач
    Полный привод 4×4
    Terrain Management — 7 режимов движения
    Шины 285/70 R17, легкосплавные диски

    Пикап, двойная кабина
    4 двери · 5 мест · левый руль
    5381×2028×1922 мм · 2330 кг
    Салон в коже · сборка Таиланд

    📱 В салоне:
    Экран 12″, приборка 12,4″
