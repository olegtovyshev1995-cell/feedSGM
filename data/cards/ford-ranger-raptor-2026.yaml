    Сиденья Raptor, электрорегулировка 10 направлений
    Двухзонный климат с обдувом 2-го ряда
    Адаптивный круиз Stop & Go
    Беспроводная зарядка, розетки 12V и 230V, USB в двух рядах

    🛡️ Безопасность:
    7 подушек, ISOFIX
    Автоторможение с распознаванием пешеходов
    Ассистент экстренного манёвра
    Контроль слепых зон
    Камеры 360°, парктроники, автопилот парковки
    ABS, ESP, HDC, TPMS

    ✨ Снаружи:
    Матричные LED-фары с адаптивным дальним
    C-образные ходовые огни, противотуманки
    Арки Raptor, защита днища
    Bedliner с розетками 12V и 230V
